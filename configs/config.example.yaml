# godelayq 运行配置模板（入库的就是这一份）
# 本文件不含任何真实凭据，可以提交；实际的运行配置是同级目录下的 config.yaml，
# 那份已被 .gitignore 排除，克隆仓库后先复制一份再填凭据：
#   cp configs/config.example.yaml configs/config.yaml
#
# 两份文件的键必须一一对应：改了任意一份的键（增删、重命名、调层级），
# 就要同步另一份，core.TestExampleConfigMatchesLocal 会在漏改时报错。
#
# 通过 ./godelayq-server -config=configs/config.yaml 指定；
# 留空时按 ./configs/config.yaml 自动查找，文件不存在则使用代码默认值。
#
# 每一项都可被环境变量覆盖，前缀 GODELAYQ_、层级用下划线连接，
# 例如 GODELAYQ_SERVER_PORT=9090、GODELAYQ_SCHEDULER_WORKERS=32。
#
# 注意：这里只收录当前真正生效的配置项，写入未知键会直接报错。

server:
  port: "8080"          # HTTP 监听端口
  auth:
    # 静态机器凭据：留空即不启用。它只给脚本/CI 用——以它进来的身份是 machine，
    # 能读写任务，但不能强制暂停、不能删组、不能用运维端点。
    # 控制台账号请配下面的 users，凭 JWT 登录。
    # 生产环境用环境变量注入：GODELAYQ_SERVER_AUTH_TOKEN=...
    token: ""
    jwt:
      # HS256 签名密钥，至少 32 字节，用 `go run ./cmd/gensecret` 生成；
      # 只能写进环境变量 GODELAYQ_SERVER_AUTH_JWT_SECRET，明文禁止写入本配置。
      # 轮换密钥会让全部已签发令牌立即失效（所有人需重新登录）。
      secret: ""
      access_ttl: 15m   # 访问令牌有效期；0 表示用代码默认值 15m
      refresh_ttl: 12h  # 刷新令牌有效期；0 表示用代码默认值 12h
    # 控制台账号。本项不能靠环境变量覆盖（嵌套列表无法用逗号分隔表达），
    # 增删账号需改本文件并重启进程。
    # 密码只存 bcrypt 哈希，用 `go run ./cmd/hashpassword` 生成；明文禁止写入配置。
    # role 取 viewer|operator|admin|ops，权限矩阵见 docs/design/web-console-design.md §5.7.3
    # 这里故意不写 []：解开下面的示例即可启用。写成 `users: []` 再挂列表项，
    # 空序列与块式序列会撞在一起，YAML 只给一句 "did not find expected key"。
    users:
    #  - name: admin01
    #    password_bcrypt: "$2a$10$..."
    #    role: admin
  cors:
    # 跨域来源白名单，元素为完整 origin；["*"] 或留空表示任意来源
    allow_origins: ["*"]
    # 允许携带 Cookie 等凭据；开启时不允许使用 "*"（启动即报错）
    allow_credentials: false

scheduler:
  workers: 100          # 并发执行协程数；0 表示使用 core.DefaultConcurrency
  queue_capacity: 0     # 执行队列容量；0 表示与 workers 相等。队列满时调度循环阻塞入队
  max_retry_delay: 30m  # 指数退避的单次重试延迟上限
  shutdown_timeout: 5s  # 优雅关闭等待时长

store:
  type: json            # 存储后端，目前仅支持 json
  path: ./data/jobs.json
  flush_interval: 200ms # 合并落盘周期；崩溃时最多丢失一个周期的状态变更
  # 终态（成功/失败/取消）快照留痕策略：ListJobs?status=success|failed 与
  # /api/v1/stats 的 completed/failed 计数都来自这份留痕。待执行任务不受影响。
  history_limit: 1000   # 保留条数；0=用默认值，-1=不留痕（写入即删除，文件最小）
  history_ttl: 0s       # 保留时长，如 24h；0 表示不按时间淘汰
  # 分组元数据文件（Web 控制台的 /api/v1/groups 读写它）。与任务快照分文件：
  # 分组是低频实体，不该被 jobs.json 的高频合并写盘拖着一起重写。
  groups_path: ./data/groups.json

logging:
  level: info           # debug|info|warn|error；排障时可临时改 debug
  format: text          # text=人读友好，json=便于日志采集端索引

# 执行器：由配置声明的可执行任务（脚本 / 已编译产物 / HTTP 请求）。
# 设计依据见 docs/design/executor-design.md，实施进度见 docs/design/tasks/executor/README.md。
executors:
  # 总开关。false 时 exec.* 任务类型一个都不注册，下面所有取值全部不生效。
  # 打开它等于把"能提交任务"扩展成"能执行命令"，所以必须同时配置上面的 server.auth
  # （token 或 users 任一）；未启用鉴权只记一条 error 级启动日志，不会拒绝启动。
  # 开发环境可用环境变量临时打开：GODELAYQ_EXECUTORS_ENABLED=true
  enabled: false
  # 提交 exec.* 任务所需的最低档位：operator|admin|ops；留空用默认 admin。
  # 静态 token 的身份是 machine，档位等同 operator，因此默认的 admin 会拒绝脚本凭据提交执行任务。
  # 降到 operator 意味着"CI 里泄漏一个 token 就能执行命令"，请先评审再改。
  required_role: admin
  # 档位里 script/program/cwd 的根目录：相对路径解析后必须仍落在它之内，
  # 越界（绝对路径、.. 或符号链接指向外部）启动即报错。留空用默认 ./exec-workspace。
  workspace: ./exec-workspace
  # 允许档位使用的解释器/程序名白名单。逗号分隔覆盖：GODELAYQ_EXECUTORS_RUNTIME_ALLOW=node,bash
  runtime_allow: [bash, sh, cmd, pwsh, node, php, python, java]
  # 传给子进程的环境变量键名白名单。GODELAYQ_ 前缀的键即使在列表里也会被强制排除：
  # 服务端的 token 与 JWT 密钥就存放在进程环境的 GODELAYQ_* 里。
  # Windows 的 SystemRoot、COMSPEC、PATHEXT 与 PATH 由执行器无条件透传（子进程启动必需的最小集），
  # 再写一遍到本列表里是正常配置，不是多余项，也不是漏洞。
  env_allow: [PATH, LANG, LC_ALL, TZ, HOME]
  # 执行器专用执行池的协程数，与 scheduler.workers 分池：
  # 共池时分钟级的脚本会长时间占住共享执行名额。留空/删掉本项用默认 4；
  # 显式写 0 会被拒（enabled=true 时要求 >=1），与"0=用默认值"的其它配置不同，
  # 这是为了让打开执行器的部署必须明确表态。
  concurrency: 4
  # 执行器队列容量；0 表示与本节 concurrency 相等。队列满时任务留在堆与存储里等空位
  queue_capacity: 0
  # 单次执行超时的默认值与上限：档位没写 timeout 时用 default_timeout；
  # 超过 max_timeout 的档位或任务请求会被直接拒绝（不是静默夹取）。
  # 执行器任务没有"不限制"这种取值——挂死的进程会一直占住执行名额。
  default_timeout: 5m
  max_timeout: 30m
  # 重启时如何处理"崩溃瞬间仍在执行"的执行器任务：
  #   pause  = 置为 paused，等人工确认后恢复（默认；外部副作用的结果未知，不替人决定）
  #   replay = 照常重新入队（重复执行的后果由部署方承担）
  # 只影响崩溃场景：优雅关闭（SIGTERM）打断的任务仍按既有语义回到待执行。
  restore_policy: pause
  # 是否允许目录任务加载器接受 exec.* 前缀的任务文件，默认 false：
  # 能往监控目录写文件不等于能执行命令。注意服务端二进制当前并不启用加载器，
  # 本项约束的是自行接入 core.DirectoryLoader 的程序。
  loader_allow: false
  output:
    # 事件与任务详情里携带的输出尾部预览字节数；完整输出在下面的产物目录。0 用默认 2048
    inline_preview: 2048
    # 单条流（stdout 或 stderr）的落盘上限，达到即停止写入并标记截断。0 用默认 262144；
    # enabled=true 时最小 1024
    max_bytes: 262144
    # 产物目录，与 store.path 分开放，便于单独设权限与清理
    dir: ./data/exec
    # 产物保留时长；0 表示不按时间清理（只做启动时的孤儿清理）。
    # 建议与上面的 store.history_ttl 配对：留痕被清掉后，对应产物会在下次启动的孤儿清理中删除
    ttl: 168h
  # 档位列表：能执行什么完全由这里决定，不提供自由命令行，也不接受任务里内联源码。
  # 与 server.auth.users 同理，这里故意不写 []（解开示例即可启用，写 [] 再挂列表项会让 YAML 报错）。
  # 键名拼错会被配置解码直接拒绝；字段取值与组合规则由 executor.LoadProfiles 在启动时校验，
  # 任一条不过即启动失败并指出档位名。字段含义与校验规则见设计文档 §5。
  commands:
  #  - name: nightly_report          # 注册后的任务类型名是 exec.nightly_report
  #    kind: script                  # script | binary | http
  #    runtime: node                 # 必须在上面的 runtime_allow 里
  #    script: scripts/report.mjs    # 相对 workspace，且必须解析在 workspace 内
  #    args:
  #      - { name: day, required: true, pattern: '^(yesterday|today)$' }
  #      - { name: token, secret: true }        # 值不进响应与错误信息
  #    args_render: ["--day={day}"]  # 只能引用 args 里声明过的名字
  #    cwd: "."                      # 相对 workspace 的工作目录
  #    env: { REPORT_HOME: /srv/report }         # 固定注入，payload 不能覆盖
  #    env_allow: [TRACE_ID]                     # payload 可注入的键名白名单
  #    timeout: 10m
  #    max_parallel: 1
  #    retry_on_exit: [75]           # 这些退出码才允许重试，其它非 0 视为重试无意义
