# godelayq 运行配置模板（入库的就是这一份）
# 本文件不含任何真实凭据，可以提交；实际的运行配置是同级目录下的 config.yaml，
# 那份已被 .gitignore 排除，克隆仓库后先复制一份再填凭据：
#   cp configs/config.example.yaml configs/config.yaml
#
# 两份文件的键必须一一对应：改了任意一份的键（增删、重命名、调层级），
# 就要同步另一份，core.TestExampleConfigMatchesLocal 会在漏改时报错。
#
# 通过 ./godelayq-server -config=configs/config.yaml 指定；
# 留空时按 ./configs/config.yaml 自动查找，文件不存在则使用代码默认值。
#
# 每一项都可被环境变量覆盖，前缀 GODELAYQ_、层级用下划线连接，
# 例如 GODELAYQ_SERVER_PORT=9090、GODELAYQ_SCHEDULER_WORKERS=32。
#
# 注意：这里只收录当前真正生效的配置项，写入未知键会直接报错。

server:
  port: "8080"          # HTTP 监听端口
  auth:
    # 静态机器凭据：留空即不启用。它只给脚本/CI 用——以它进来的身份是 machine，
    # 能读写任务，但不能强制暂停、不能删组、不能用运维端点。
    # 控制台账号请配下面的 users，凭 JWT 登录。
    # 生产环境用环境变量注入：GODELAYQ_SERVER_AUTH_TOKEN=...
    token: ""
    jwt:
      # HS256 签名密钥，至少 32 字节，用 `go run ./cmd/gensecret` 生成；
      # 只能写进环境变量 GODELAYQ_SERVER_AUTH_JWT_SECRET，明文禁止写入本配置。
      # 轮换密钥会让全部已签发令牌立即失效（所有人需重新登录）。
      secret: ""
      access_ttl: 15m   # 访问令牌有效期；0 表示用代码默认值 15m
      refresh_ttl: 12h  # 刷新令牌有效期；0 表示用代码默认值 12h
    # 控制台账号。本项不能靠环境变量覆盖（嵌套列表无法用逗号分隔表达），
    # 增删账号需改本文件并重启进程。热重载也不会代劳这件事：`reload.enabled: true` 时
    # 改动 server.auth.users（以及下面的 token 与 jwt.secret）会让整次重载被拒绝，
    # 一项都不会应用，旧凭据照旧可用。
    # 密码只存 bcrypt 哈希，用 `go run ./cmd/hashpassword` 生成；明文禁止写入配置。
    # role 取 viewer|operator|admin|ops，权限矩阵见 docs/design/web-console-design.md §5.7.3
    # 这里故意不写 []：解开下面的示例即可启用。写成 `users: []` 再挂列表项，
    # 空序列与块式序列会撞在一起，YAML 只给一句 "did not find expected key"。
    users:
    #  - name: admin01
    #    password_bcrypt: "$2a$10$..."
    #    role: admin
  cors:
    # 跨域来源白名单，元素为完整 origin；["*"] 或留空表示任意来源
    allow_origins: ["*"]
    # 允许携带 Cookie 等凭据；开启时不允许使用 "*"（启动即报错）
    allow_credentials: false

scheduler:
  workers: 100          # 并发执行协程数；0 表示使用 core.DefaultConcurrency
  queue_capacity: 0     # 执行队列容量；0 表示与 workers 相等。队列满时调度循环阻塞入队
  max_retry_delay: 30m  # 指数退避的单次重试延迟上限
  shutdown_timeout: 5s  # 优雅关闭等待时长

store:
  type: json            # 存储后端，目前仅支持 json
  path: ./data/jobs.json
  flush_interval: 200ms # 合并落盘周期；崩溃时最多丢失一个周期的状态变更
  # 终态（成功/失败/取消）快照留痕策略：ListJobs?status=success|failed 与
  # /api/v1/stats 的 completed/failed 计数都来自这份留痕。待执行任务不受影响。
  history_limit: 1000   # 保留条数；0=用默认值，-1=不留痕（写入即删除，文件最小）
  history_ttl: 0s       # 保留时长，如 24h；0 表示不按时间淘汰
  # 分组元数据文件（Web 控制台的 /api/v1/groups 读写它）。与任务快照分文件：
  # 分组是低频实体，不该被 jobs.json 的高频合并写盘拖着一起重写。
  groups_path: ./data/groups.json

logging:
  level: info           # debug|info|warn|error；排障时可临时改 debug
  format: text          # text=人读友好，json=便于日志采集端索引

# 执行器：由配置声明的可执行任务（脚本 / 已编译产物 / HTTP 请求）。
# 设计依据见 docs/design/executor-design.md，实施进度见 docs/design/tasks/executor/README.md。
executors:
  # 总开关。false 时 exec.* 任务类型一个都不注册，下面所有取值全部不生效。
  # 打开它等于把"能提交任务"扩展成"能执行命令"，所以必须同时配置上面的 server.auth
  # （token 或 users 任一）；未启用鉴权只记一条 error 级启动日志，不会拒绝启动。
  # 开发环境可用环境变量临时打开：GODELAYQ_EXECUTORS_ENABLED=true
  enabled: false
  # 提交 exec.* 任务所需的最低档位：operator|admin|ops；留空用默认 admin。
  # 静态 token 的身份是 machine，档位等同 operator，因此默认的 admin 会拒绝脚本凭据提交执行任务。
  # 降到 operator 意味着"CI 里泄漏一个 token 就能执行命令"，请先评审再改。
  required_role: admin
  # 档位里 script/program/cwd 的根目录：相对路径解析后必须仍落在它之内，
  # 越界（绝对路径、.. 或符号链接指向外部）启动即报错。留空用默认 ./exec-workspace。
  workspace: ./exec-workspace
  # 允许档位使用的解释器/程序名白名单。逗号分隔覆盖：GODELAYQ_EXECUTORS_RUNTIME_ALLOW=node,bash
  runtime_allow: [bash, sh, cmd, pwsh, node, php, python, java]
  # 传给子进程的环境变量键名白名单。GODELAYQ_ 前缀的键即使在列表里也会被强制排除：
  # 服务端的 token 与 JWT 密钥就存放在进程环境的 GODELAYQ_* 里。
  # Windows 的 SystemRoot、COMSPEC、PATHEXT 与 PATH 由执行器无条件透传（子进程启动必需的最小集），
  # 再写一遍到本列表里是正常配置，不是多余项，也不是漏洞。
  env_allow: [PATH, LANG, LC_ALL, TZ, HOME]
  # 执行器专用执行池的协程数，与 scheduler.workers 分池：
  # 共池时分钟级的脚本会长时间占住共享执行名额。留空/删掉本项用默认 4；
  # 显式写 0 会被拒（enabled=true 时要求 >=1），与"0=用默认值"的其它配置不同，
  # 这是为了让打开执行器的部署必须明确表态。
  concurrency: 4
  # 执行器队列容量；0 表示与本节 concurrency 相等。队列满时任务留在堆与存储里等空位
  queue_capacity: 0
  # 单次执行超时的默认值与上限：档位没写 timeout 时用 default_timeout；
  # 超过 max_timeout 的档位或任务请求会被直接拒绝（不是静默夹取）。
  # 执行器任务没有"不限制"这种取值——挂死的进程会一直占住执行名额。
  default_timeout: 5m
  max_timeout: 30m
  # 重启时如何处理"崩溃瞬间仍在执行"的执行器任务：
  #   pause  = 置为 paused，等人工确认后恢复（默认；外部副作用的结果未知，不替人决定）
  #   replay = 照常重新入队（重复执行的后果由部署方承担）
  # 只影响崩溃场景：优雅关闭（SIGTERM）打断的任务仍按既有语义回到待执行。
  restore_policy: pause
  # 是否允许目录任务加载器接受 exec.* 前缀的任务文件，默认 false：
  # 能往监控目录写文件不等于能执行命令。注意服务端二进制当前并不启用加载器，
  # 本项约束的是自行接入 core.DirectoryLoader 的程序。
  loader_allow: false
  # 档位在线管理：打开后可以在 Web 控制台与 REST 写端点上增删改档位（改完立即生效、重启仍在）。
  # 这条边界比"改配置重启"宽得多——它把"能执行什么"的修改权限交给了 ops 档 JWT，
  # 所以默认 false。打开它必须同时 executors.enabled: true，否则启动即报（与 loader_allow
  # 同一条：没有执行能力却允许在线改档位，只能是配置写错）。
  # 本项自己是重启档：热重载不会代劳它——`reload.enabled: true` 时改 web_enabled 也只会进
  # ignored_keys，要生效仍需重启进程。
  # 设计依据见 docs/design/web-profile-design.md §2（D2）。
  # 环境变量：GODELAYQ_EXECUTORS_WEB_ENABLED=true
  web_enabled: false
  # 页面建的档位存放处。它只是 executors.commands 之外的第二份来源：启动时两份合并，
  # 同名以本节 commands 为准，文件里那一条会被标记为未生效。
  # 留空用默认 ./data/exec-profiles.json。文件不存在是正常状态（还没人在页面上建过档位）；
  # 内容损坏会导致启动失败——静默当成空文件会抹掉已建好的档位，
  # 删掉或修好该文件即可退回"只由 executors.commands 决定"的形态。
  # 它是"这台机器能执行什么"的一部分：备份 data/ 时请一起带上；
  # 档位里的本机路径换一台机器会探测失败，那是预期而不是故障。
  # 环境变量：GODELAYQ_EXECUTORS_PROFILES_PATH=/srv/godelayq/exec-profiles.json
  profiles_path: ./data/exec-profiles.json
  output:
    # 事件与任务详情里携带的输出尾部预览字节数；完整输出在下面的产物目录。0 用默认 2048
    inline_preview: 2048
    # 单条流（stdout 或 stderr）的落盘上限，达到即停止写入并标记截断。0 用默认 262144；
    # enabled=true 时最小 1024
    max_bytes: 262144
    # 产物目录，与 store.path 分开放，便于单独设权限与清理
    dir: ./data/exec
    # 产物保留时长；0 表示不按时间清理（只做启动时的孤儿清理）。
    # 建议与上面的 store.history_ttl 配对：留痕被清掉后，对应产物会在下次启动的孤儿清理中删除
    ttl: 168h
  # 档位列表（两份来源之一）：这一节之外的另一份是下面的 profiles_path，页面建的档位改完立即生效。
  # 本节是配置面：`reload.enabled: false`（默认）时改它要重启进程；打开热重载时，改条目自身的可改字段
  # （timeout、参数声明、条目增删）下一个防抖窗口就生效，而改动条目内的执行许可字段
  # （kind/runtime/script/program/fixed_args/cwd/env/env_allow/method/url_template/allowed_hosts/
  # headers/header_allow/deny_private_ranges/max_redirects）会让整次重载被拒绝；顶层的 workspace、
  # runtime_allow、env_allow 属重启档，改完仍需重启。同名档位以本节为准（档位文件里那条会被标记为未生效）。
  # 两种来源都不提供自由命令行，也不接受任务里内联源码。
  # 与 server.auth.users 同理，这里故意不写 []（解开示例即可启用，写 [] 再挂列表项会让 YAML 报错）。
  # 键名拼错会被配置解码直接拒绝；字段取值与组合规则由 executor.LoadProfiles 在启动时校验，
  # 任一条不过即启动失败并指出档位名。字段含义与校验规则见设计文档 §5。
  commands:
  #  - name: nightly_report          # 注册后的任务类型名是 exec.nightly_report
  #    kind: script                  # script | binary | http
  #    runtime: node                 # 必须在上面的 runtime_allow 里
  #    script: scripts/report.mjs    # 相对 workspace，且必须解析在 workspace 内
  #    args:
  #      - { name: day, required: true, pattern: '^(yesterday|today)$' }
  #      - { name: token, secret: true }        # 值不进响应与错误信息
  #    args_render: ["--day={day}"]  # 只能引用 args 里声明过的名字
  #    cwd: "."                      # 相对 workspace 的工作目录
  #    env: { REPORT_HOME: /srv/report }         # 固定注入，payload 不能覆盖
  #    env_allow: [TRACE_ID]                     # payload 可注入的键名白名单
  #    timeout: 10m
  #    max_parallel: 1
  #    retry_on_exit: [75]           # 这些退出码才允许重试，其它非 0 视为重试无意义

# SQLite 观测层：运行事件、产物索引、写操作审计三张本地表。
# 设计依据见 docs/design/sqlite-observability-design.md，实施进度见 docs/design/tasks/sqlite/README.md。
# 它独立于上面的 store 一节：这里不改任务快照的存放位置（jobs.json 照旧），
# 只是新增三块观测数据；写坏的观测库删掉文件即可重建。
observability:
  # 总开关。false 时不创建任何文件、不订阅事件总线、不注入写入器，下面所有取值全部不生效，
  # 进程行为与没有本节时一致。
  # 开发环境可用环境变量临时打开：GODELAYQ_OBSERVABILITY_ENABLED=true
  enabled: false
  # 观测库文件路径，父目录不存在时由启动装配创建。与 store.path、executors.output.dir
  # 同一目录树但不同文件，便于单独设权限；WAL 模式会额外产生 -wal/-shm 旁文件。
  # 文件权限 0640、目录 0750，与产物文件同一取向。
  path: ./data/observe.sqlite
  # 批量写入周期：三个写入器各自攒够一个周期就开一个事务落盘。
  # 它同时是事件端点看到最新一条的延迟上界（实时增量走 WebSocket 推送，不受影响）。
  # 0 用默认 200ms（与上面的 store.flush_interval 同一口径）；低于 10ms 会被拒绝——
  # 那样等价于每写一条记录开一个事务。由 S02 消费。
  flush_interval: 200ms
  # 每个写入器的有界队列容量：队满即丢弃新记录并累计计数（丢弃数在 /admin/runtime 可查），
  # 绝不阻塞事件总线或请求路径。显式写 0 会被拒（enabled=true 时要求正数），
  # 与 store.flush_interval 那类"0=用默认值"的写法不同，这是为了让"一条都不留"必须显式表态。
  queue_capacity: 4096
  # SQLite 锁等待上限；0 用默认 2s。单连接写入（SetMaxOpenConns(1)）已消除大部分 busy 竞争。
  busy_timeout: 2s
  # synchronous PRAGMA：normal（默认）| full。
  # normal 在 WAL 下断电最多丢最后若干次已提交事务，与 JSONFileStore"崩溃最多丢一个合并周期"
  # 同量级；需要更强保证的部署改配 full（每次提交都等磁盘同步，写入更慢）。
  synchronous: normal
  events:
    # 运行事件表 job_events：把 EventBus 广播的 job.* 事件持久化，重启后详情页时间线仍有历史。
    # 由 S03 写入、S04 读取。关掉它只建表不写入，事件端点仍读内存缓冲（即现在的行为）。
    enabled: true
    # 保留条数，超出按写入顺序淘汰最旧；<=0 用默认 200000（约 6 万次执行的事件量）。
    # 需要长历史时优先调这一项，不要调 store.history_limit：两者保留的是不同东西。
    retention_count: 200000
    # 保留时长；0 表示不按时间淘汰。事件比终态快照留得久是有意设计（排障时更常回看历史事件）。
    retention_age: 720h
  artifacts:
    # 产物索引表 artifact_index：按任务与尝试记录输出文件的尺寸、截断与清理状态。
    # 由 S05 消费。它是"加速器"而不是账本——写失败时文件仍是权威，最终判定以文件存在为准。
    enabled: true
  audit:
    # 写操作审计表 write_audit：每个 POST/PUT/DELETE 请求一行台账（谁、什么身份、做了什么、
    # 成没成、多快），由 S06 消费；读端点不进台账，否则会被前端轮询写满。
    # 只存封闭枚举的结论码，不存请求体、参数取值与 error 原文。
    enabled: true
    # 保留条数；<=0 用默认 500000。CI 里高频建任务的部署会先撞到条数上界而不是天数。
    retention_count: 500000
    # 保留时长；0 表示不按时间淘汰。默认 90 天：安全台账的价值在事后追溯。
    retention_age: 2160h

# 配置热重载：改文件即生效，不必重启进程。默认关闭，关闭时一个监听器都不建，
# 进程行为与本节不存在时一致。
# 设计依据见 docs/design/config-reload-design.md，实施进度见 docs/design/tasks/config-reload/README.md。
#
# 打开之后每一项各自的去向分三档（完整清单见部署文档的"配置热重载"一节）：
#   热更 = 改了下一个防抖窗口生效：logging.level、scheduler.workers、scheduler.max_retry_delay、
#          store.history_limit、store.history_ttl、observability 的四个 retention_*、
#          executors.commands（条目内容与增删）、reload.debounce。
#   重启 = 改了接受但不应用（读数里进 ignored_keys），重启才变：本节 reload.enabled 自己、
#          两个 queue_capacity、各 flush_interval、所有路径与所有 enabled 总开关、
#          executors 的顶层白名单与 required_role/超时上限、logging.format、server.port、server.cors.*。
#   拒绝 = 改了整次作废（进 rejected_keys，一项都不应用）：server.auth.token、server.auth.users、
#          server.auth.jwt.secret，以及 executors.commands 条目内的十五项执行许可字段
#          （kind/runtime/script/program/fixed_args/cwd/env/env_allow/method/url_template/
#          allowed_hosts/headers/header_allow/deny_private_ranges/max_redirects）。
# 坏文件（未知键、缩进错、被删）同样是整次作废；一份不再表达任何取值的文件也一样——
# 只剩空白/注释/文档标记（含带 BOM 或 UTF-16 写成的），或只有键名没有值（`logging:`、`workers: null`、
#   `logging: {}`、顶层 `null`），读出来是一份合法的全默认配置，拦下来才不会被静默应用到现网。
# 进程停在旧配置上；文件修好即自动恢复。
# 注意"把某项从文件里删掉"不等于"让它空着"：比较的是整份文件，没写的键会退回默认值并生效。
reload:
  # 总开关。打开后进程会盯着启动时实际读到的那个文件（见设计文档 §5.2）。
  # 这一项本身改了不生效：运行期关掉监听只能重启，所以它属于重启档。
  # 环境变量：GODELAYQ_RELOAD_ENABLED=true
  enabled: false
  # 静默窗口：同一文件在这段时间内的多次写入合并成一次重载。
  # 编辑器存盘往往拆成 Create + 多次 Write，逐次读会读到半截内容。
  # 留空/0 用默认 500ms；低于 50ms 会被拒（那样等于每次存盘读好几遍配置文件）。
  # 这一项可以热更：改它下一次事件就用新窗口。
  # 环境变量：GODELAYQ_RELOAD_DEBOUNCE=2s
  debounce: 500ms
