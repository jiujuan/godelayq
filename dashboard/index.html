<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>godelayq 控制台已迁移</title>
    <style>
        body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; margin: 40px auto; max-width: 640px; padding: 0 20px; color: #1f2937; background: #fff; }
        h1 { font-size: 20px; margin-bottom: 8px; }
        p { line-height: 1.7; color: #4b5563; }
        code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; font-size: 14px; }
        .box { border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px 20px; margin-top: 24px; }
        .box a { color: #2563eb; }
        #hint { display: none; }
    </style>
</head>
<body>
    <h1>这个页面已经被 Vue 控制台取代</h1>
    <p>旧版单文件监控面板的能力（WS 状态、事件类型过滤、事件流）落在新控制台的<strong>实时</strong>页，
        统计卡片在<strong>概览</strong>页。控制台由服务端同源提供，地址就是这个服务的根路径。</p>

    <div class="box">
        <p id="auto">正在跳转到控制台…… 如果没有反应，点这里：<a id="link" href="/">进入控制台</a></p>
        <p id="hint">
            你是用 <code>file://</code> 直接打开这个文件的，浏览器无法据此推断控制台在哪台机器上。
            请改为打开服务根地址（默认 <a id="suggested" href="#">http://127.0.0.1:8080/</a>）；
            那个进程需要带前端产物，构建方式见仓库 README 的"部署形态"。
        </p>
    </div>

    <script>
        // 这个文件不由服务端托管（它在仓库里，控制台挂载在 / 之后也轮不到它），
        // 所以跳转目标只能按当前来源推断：同源根路径就是控制台。
        var served = location.protocol === 'http:' || location.protocol === 'https:';
        document.getElementById('hint').style.display = served ? 'none' : 'block';
        document.getElementById('auto').style.display = served ? 'block' : 'none';

        if (served) {
            document.getElementById('link').href = location.origin + '/';
            setTimeout(function () { location.replace(location.origin + '/'); }, 1500);
        } else {
            document.getElementById('suggested').href = 'http://127.0.0.1:8080/';
        }
    </script>
</body>
</html>
